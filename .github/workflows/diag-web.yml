# Prueba de avisos desde el PHP web (no el de consola). Crea un script temporal, lo llama y lo borra.
name: Diagnostico web
on: workflow_dispatch
env:
  SSH_HOST: 45.132.157.212
  SSH_PORT: '65002'
  SSH_USER: u459164554
  DP: /home/u459164554/domains/panaro.com.ar/public_html/panaro-pedidos
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Probar desde la web
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519; chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          N="_diag_$(openssl rand -hex 12).php"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "cat > '$DP/$N'" <<'PHP'
          <?php
          header('Content-Type: text/plain; charset=utf-8');
          require __DIR__ . '/config.php';
          echo "sapi: ", PHP_SAPI, " · php ", PHP_VERSION, "\n";
          foreach (['allow_url_fopen','disable_functions','sendmail_path','max_execution_time','openssl.cafile'] as $k) echo "$k = ", ini_get($k), "\n";
          echo "ext curl: ", extension_loaded('curl') ? 'sí' : 'NO', " · openssl: ", extension_loaded('openssl') ? 'sí' : 'NO', "\n";
          $url = 'https://api.telegram.org/bot' . TELEGRAM_BOT_TOKEN . '/sendMessage';
          $q = http_build_query(['chat_id' => TELEGRAM_CHAT_ID, 'text' => '🔧 Prueba desde la web (fopen)']);
          $r = @file_get_contents($url, false, stream_context_create(['http' => ['method' => 'POST', 'header' => "Content-Type: application/x-www-form-urlencoded\r\n", 'content' => $q, 'timeout' => 8, 'ignore_errors' => true]]));
          echo "telegram fopen: ", $r === false ? 'FALLÓ ' . (error_get_last()['message'] ?? '') : substr($r, 0, 60), "\n";
          if (function_exists('curl_init')) {
            $ch = curl_init($url);
            curl_setopt_array($ch, [CURLOPT_POST => 1, CURLOPT_POSTFIELDS => http_build_query(['chat_id' => TELEGRAM_CHAT_ID, 'text' => '🔧 Prueba desde la web (curl)']), CURLOPT_RETURNTRANSFER => 1, CURLOPT_TIMEOUT => 8]);
            $r = curl_exec($ch); echo "telegram curl: ", $r === false ? 'FALLÓ ' . curl_error($ch) : substr($r, 0, 60), "\n";
          }
          $h = "MIME-Version: 1.0\r\nContent-Type: text/plain; charset=UTF-8\r\nFrom: " . MAIL_NAME . " <" . MAIL_FROM . ">\r\n";
          echo "mail(): ", mail(MAIL_TO, 'Prueba de avisos desde la web', 'Prueba del portal (web).', $h) ? 'true' : 'FALSE', "\n";
          PHP
          curl -s -m 40 "https://pedidos.panaro.com.ar/$N" | sed 's/^/WEB> /' || true
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "rm -f '$DP/$N'; ls '$DP'/_diag_* 2>/dev/null | wc -l | sed 's/^/WEB> scripts temporales que quedan: /'"
